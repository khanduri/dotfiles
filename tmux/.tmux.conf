# Optional server fallback; no plugins or external status commands.
unbind-key C-b
set-option -g prefix C-a
bind-key a send-prefix
bind-key r source-file ~/.tmux.conf
bind-key s split-window -v
bind-key v split-window -h
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
set-option -g history-limit 50000
set-option -g mouse on
set-option -g status-position bottom
set-option -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set-option -g status-left '#S '
set-option -g status-right '#H %H:%M'
set-window-option -g window-status-current-style 'fg=#cba6f7,bold'
